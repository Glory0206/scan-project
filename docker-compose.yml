services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
    restart: always
    depends_on:
      - backend
